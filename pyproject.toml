[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ultra-review"
version = "2.0.0"
description = "Strict contracts for the local ultra review V2 evaluation slice"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20,<5"]

[project.scripts]
local-ultra-review-v2 = "local_ultra_review.orchestrator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"local_ultra_review.resources" = ["schemas/*.json", "prompts/*.md"]
